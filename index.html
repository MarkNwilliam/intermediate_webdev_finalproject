<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Interest Rate Calculator | Simple Interest Calculator</title>
    <meta
      name="description"
      content="Free online interest rate calculator. Enter a principal amount, an interest rate and a term in years to see the total interest and total amount instantly."
    />
    <meta name="keywords" content="interest rate calculator, simple interest calculator, principal, rate, time" />
    <meta name="author" content="Interest Rate Calculator" />

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="favicon.ico" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="calculator">
      <h1>Interest Rate Calculator</h1>
      <p class="subtitle">Work out the simple interest on a principal over a number of years.</p>

      <p id="error-message" class="error" role="alert" hidden></p>

      <div class="input-wrapper">
        <div class="wrapper">
          <label for="principal">Principal Amount</label>
          <input type="number" id="principal" name="principal" value="1000" min="0" step="0.01" />
        </div>
      </div>

      <div class="input-wrapper">
        <div class="wrapper">
          <label for="rate">Rate (%)</label>
          <input type="number" id="rate" name="rate" value="5" min="0" step="0.01" />
        </div>
      </div>

      <div class="input-wrapper">
        <div class="wrapper">
          <label for="time">Time (Years)</label>
          <input type="number" id="time" name="time" value="1" min="0" step="0.01" />
        </div>
      </div>

      <button type="button" id="calculate-btn" onclick="calculate()">Calculate</button>

      <div id="result" aria-live="polite"></div>
    </main>

    <!-- The calculator script, loaded at the end of the body. -->
    <script src="script.js"></script>
  </body>
</html>
